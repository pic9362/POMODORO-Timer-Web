<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POMODORO</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="container">
    <h1>POMODORO</h1>

    <div class="timer" role="timer" aria-live="off">25:00</div>

    <div class="controls">
      <button type="button" class="btn btn-start">시작</button>
      <button type="button" class="btn btn-stop">정지</button>
      <button type="button" class="btn btn-reset">초기화</button>
    </div>

    <button type="button" class="btn btn-settings">설정</button>
  </main>
  <script src="index.js"></script>
</body>
</html>
